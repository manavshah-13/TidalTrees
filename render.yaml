# ========================================================
# TidalTrees Infrastructure as Code — Render Blueprint
# Provisioning Web Service, PostgreSQL Database, and Redis
# ========================================================
services:
  # ------------------------------------------------------
  # FastAPI Production Backend Service
  # ------------------------------------------------------
  - type: web
    name: tidaltrees-backend
    runtime: python
    region: oregon
    plan: starter
    branch: main
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        fromDatabase:
          name: tidaltrees-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: tidaltrees-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: FRONTEND_URL
        value: https://tidaltrees.vercel.app

  # ------------------------------------------------------
  # In-Memory Cache (Redis 7) for Leaderboard Acceleration
  # ------------------------------------------------------
  - type: redis
    name: tidaltrees-redis
    region: oregon
    plan: starter
    ipAllowList: [] # Private network access only

# --------------------------------------------------------
# Managed PostgreSQL Database
# --------------------------------------------------------
databases:
  - name: tidaltrees-db
    databaseName: tidaltrees
    user: tidaltrees
    region: oregon
    plan: starter
