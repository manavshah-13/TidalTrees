name: TidalTrees CI Pipeline

on:
  push:
    branches: [ main, frontend ]
  pull_request:
    branches: [ main, frontend ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================
  # Backend Testing, Linting & Smoke Tests
  # ========================================================
  backend-ci:
    name: Backend CI (Python 3.11 + PostgreSQL + Redis)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3-alpine
        env:
          POSTGRES_USER: tidaltrees
          POSTGRES_PASSWORD: tidaltrees_secret
          POSTGRES_DB: tidaltrees
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite & Health Smoke Tests
        env:
          DATABASE_URL: postgresql://tidaltrees:tidaltrees_secret@localhost:5432/tidaltrees
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci_test_secret_key_tidal_trees_production_grade_32chars
          FRONTEND_URL: http://localhost:5173
        run: |
          cd backend
          pytest tests/ -v

  # ========================================================
  # Frontend Testing, Linting & Build Verification
  # ========================================================
  frontend-ci:
    name: Frontend CI (Node.js 20 + Vitest + Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest Component & Unit Tests
        run: |
          cd frontend
          npm run test

      - name: Verify Production Bundle Build
        run: |
          cd frontend
          npm run build
