version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: tidaltrees-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tidaltrees}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tidaltrees_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tidaltrees}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tidaltrees"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
