version: '3.9'

services:
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: tidaltrees-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tidaltrees}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tidaltrees_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tidaltrees}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tidaltrees"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tidaltrees-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tidaltrees-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql://tidaltrees:tidaltrees_secret@db:5432/tidaltrees
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
